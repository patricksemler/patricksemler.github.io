<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#101010"/>
  <rect x="0.5" y="0.5" width="1199" height="674" stroke="#2E2E2E"/>

  <text x="72" y="85" fill="#707070" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">VERIFICATION PIPELINE</text>
  <text x="72" y="128" fill="#F2F2F0" font-family="Arial, sans-serif" font-size="28">Every candidate has to earn its way to publish.</text>

  <g transform="translate(72 220)">
    <rect width="228" height="190" rx="2" stroke="#3A3A3A"/>
    <text x="24" y="38" fill="#707070" font-family="Arial, sans-serif" font-size="15">01</text>
    <text x="24" y="90" fill="#F2F2F0" font-family="Arial, sans-serif" font-size="22">Generate</text>
    <text x="24" y="126" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="16">Candidate prompt,</text>
    <text x="24" y="151" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="16">examples, and tests</text>
  </g>

  <path d="M316 315H345" stroke="#707070"/>
  <path d="M340 310L345 315L340 320" stroke="#707070"/>

  <g transform="translate(361 220)">
    <rect width="228" height="190" rx="2" stroke="#3A3A3A"/>
    <text x="24" y="38" fill="#707070" font-family="Arial, sans-serif" font-size="15">02</text>
    <text x="24" y="90" fill="#F2F2F0" font-family="Arial, sans-serif" font-size="22">Test</text>
    <text x="24" y="126" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="16">Run authored and</text>
    <text x="24" y="151" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="16">randomized cases</text>
  </g>

  <path d="M605 315H634" stroke="#707070"/>
  <path d="M629 310L634 315L629 320" stroke="#707070"/>

  <g transform="translate(650 220)">
    <rect width="228" height="190" rx="2" stroke="#3A3A3A"/>
    <text x="24" y="38" fill="#707070" font-family="Arial, sans-serif" font-size="15">03</text>
    <text x="24" y="90" fill="#F2F2F0" font-family="Arial, sans-serif" font-size="22">Compare</text>
    <text x="24" y="126" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="16">Check against an</text>
    <text x="24" y="151" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="16">independent solution</text>
  </g>

  <path d="M894 315H923" stroke="#707070"/>
  <path d="M918 310L923 315L918 320" stroke="#707070"/>

  <g transform="translate(939 220)">
    <rect width="189" height="190" rx="2" stroke="#F2F2F0"/>
    <text x="24" y="38" fill="#707070" font-family="Arial, sans-serif" font-size="15">04</text>
    <text x="24" y="90" fill="#F2F2F0" font-family="Arial, sans-serif" font-size="22">Decide</text>
    <text x="24" y="126" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="16">Publish when every</text>
    <text x="24" y="151" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="16">check agrees</text>
  </g>

  <line x1="72" y1="515" x2="1128" y2="515" stroke="#262626"/>
  <circle cx="82" cy="566" r="5" fill="#F2F2F0"/>
  <text x="104" y="572" fill="#A1A1A1" font-family="Arial, sans-serif" font-size="17">Disagreement routes the candidate back for revision instead of forward to a learner.</text>
</svg>
